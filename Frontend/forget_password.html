<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | LiteracyAI</title>

    <link rel="stylesheet" href="forget_password.css">
</head>

<body>

    <div class="page-container">

        <!-- Left Section -->
        <div class="welcome-section">

            <div class="brand">
                <div class="logo-icon">📚</div>

                <div>
                    <h1>LiteracyAI</h1>
                    <p>Intelligent Literacy Assistance Platform</p>
                </div>
            </div>

            <div class="welcome-content">

                <h2>Reset Your Password</h2>

                <p>
                    Don't worry! Enter your registered email and create
                    a new password to regain access to your account.
                </p>

            </div>

        </div>


        <!-- Reset Password Section -->
        <div class="forgot-section">

            <div class="forgot-card">

                <h2>Forgot Password?</h2>

                <p class="subtitle">
                    Enter your registered email and choose a new password.
                </p>


                <form id="forgotPasswordForm">

                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your registered email"
                            required
                        >

                    </div>


                    <!-- New Password -->
                    <div class="input-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                    </div>


                    <button type="submit" class="reset-btn">
                        Reset Password
                    </button>

                </form>


                <div class="back-login">
                    Remember your password?

                    <a href="login.html">
                        Back to Login
                    </a>
                </div>

            </div>

        </div>

    </div>


    <script src="forget_password.js"></script>

</body>

</html>
